[package]
name = "dota2overlay"
version = "0.1.0"
description = "Dota 2 Counter Overlay"
authors = ["dota2overlay"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "dota2overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }
flate2 = "1"

[dependencies]
tauri = { version = "2.12.6", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
tiny_http = "0.12"
reqwest = { version = "0.12", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
xcap = "0.9"
winreg = "0.56"
base64 = "0.23"
log = "0.4"
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "s"
